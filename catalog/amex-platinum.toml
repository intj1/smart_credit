credit_patterns = ["lululemon.*credit"]
merchants = ["lululemon"]
how_to_use = "Enroll, then shop at US lululemon stores (not outlets) or lululemon.com. Gift cards are excluded."
source_url = "https://www.americanexpress.com/us/credit-cards/card/platinum/"

[[benefit]]
id = "amex-platinum-uber-cash"
name = "Uber Cash"
kind = "checkoff"
value = 15.00
month_values = { "12" = 35.00 }
cadence = "monthly"
category = "travel"
how_to_use = "Add the Platinum Card to your Uber account: $15 of Uber Cash each month, $35 in December. Expires at month end and never appears on the card statement, so check it off here once spent."
source_url = "https://www.americanexpress.com/en-us/credit-cards/credit-intel/how-does-the-american-express-platinum-uber-credit-work/"

[[benefit]]
