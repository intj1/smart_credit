# Values last reviewed 2026-11-23 from secondary sources (see source_url on each
# entry). Re-check against the issuer's benefit terms during the monthly review.
version = "2026-11-23"

[product]
id = "amex-platinum"
provider = "amex"
issuer = "American Express"
name = "Amex Platinum"
annual_fee = 895.00
name_hints = ["platinum"]

[[benefit]]
id = "amex-platinum-hotel"
name = "Lodging credit (FHR / Hotel Collection / Airbnb Luxe)"
value = 300.00
cadence = "semiannual"
category = "travel"
credit_patterns = ["amex\\s+hotel\\s*credit", "lodging\\s+credit"]
merchants = ["amex\\s+fine\\s+hotels", "amex\\s+hotel\\s+collectn", "luxe\\s+airbnb"]
how_to_use = "Book a prepaid Fine Hotels + Resorts or Hotel Collection stay (2-night minimum for Hotel Collection; FHR too from 2027), or a prepaid Airbnb Luxe stay of 2+ nights, through Amex Travel. Jan-Jun and Jul-Dec."
source_url = "https://www.americanexpress.com/en-us/travel/benefits/how-to-use-hotel-credit"

[[benefit]]
id = "amex-platinum-resy"
name = "Resy dining credit"
value = 100.00
cadence = "quarterly"
enrollment_required = true
category = "dining"
credit_patterns = ["resy.*credit"]
merchants = ["\\bresy\\b"]
how_to_use = "Enroll, then pay with the Platinum Card at US Resy restaurants. Resy gift cards are excluded."
source_url = "https://www.nerdwallet.com/credit-cards/news/amex-platinum-hikes-fee-adds-hundreds-in-credits"

[[benefit]]
