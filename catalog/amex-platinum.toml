value = 25.00
cadence = "monthly"
enrollment_required = true
category = "subscriptions"
credit_patterns = ["digital\\s+entertainment\\s+credit"]
merchants = ["disney\\s*\\+|disney\\s*plus", "\\bhulu\\b", "\\bespn\\b", "new\\s+york\\s+times|nytimes", "paramount\\s*\\+|paramount\\s*plus", "peacock", "wall\\s+street\\s+journal|\\bwsj\\b", "youtube\\s*(premium|tv)"]
how_to_use = "Enroll, then pay the provider directly: Disney+, Hulu, ESPN, The New York Times, Paramount+, Peacock, The Wall Street Journal, YouTube Premium or YouTube TV."
source_url = "https://www.americanexpress.com/en-us/credit-cards/credit-intel/how-does-the-amex-platinum-digital-entertainment-credit-work/"

